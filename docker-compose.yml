# Leitstelle Bavaria Control – Docker Compose
# Start/Stopp erfolgt über die Skripte (install.sh, update.sh) bzw. den systemd-Dienst
# "leitstelle-bavaria". Die Datenbank liegt extern bei STRATO – hier läuft KEINE Datenbank.

x-app: &app
  image: leitstelle-bavaria/server:latest
  build:
    context: ./server
  env_file: .env
  environment:
    ENV_FILE_PATH: /app/config/.env
    BACKUP_DIR: /backups
  volumes:
    - ./.env:/app/config/.env
    - ./backups:/backups
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  backend:
    <<: *app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  bot:
    <<: *app
    command: ["python", "-m", "lbc.bot"]
    environment:
      ENV_FILE_PATH: /app/config/.env
      BACKUP_DIR: /backups
      RUN_SCHEDULER: "false"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import time,sys; sys.exit(0 if time.time() - int(open('/tmp/lbc-bot-heartbeat').read()) < 120 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  web:
    image: leitstelle-bavaria/web:latest
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Nur an die Tailscale-IP binden – das Panel ist NICHT öffentlich erreichbar.
      - "${BIND_ADDRESS:-127.0.0.1}:443:443"
      - "${BIND_ADDRESS:-127.0.0.1}:80:80"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
